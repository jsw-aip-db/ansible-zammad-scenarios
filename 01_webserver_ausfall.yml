---
- name: Szenario 1 - Webserver Ausfall mit E-Mail-Ticket an Zammad
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Öffne maximiertes XFCE-Terminal im Hintergrund auf der VM
      become_user: user
      environment:
        DISPLAY: ":0.0"
        XAUTHORITY: "/home/user/.Xauthority"
      ansible.builtin.shell: |
        xfce4-terminal --maximize --command="bash -c '
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo -e \"\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1024 (Webserver Ausfall)\033[0m\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \" System:     10.80.49.125\"
          echo \" Dienst:     Nginx Webserver (Gestoppt)\"
          echo \"\"
          echo \" AUFGABE: Analysieren Sie das Problem und beheben Sie den Ausfall!\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \"\"
          echo \"Drücke Enter, wenn du dieses Fenster schliessen willst...\"
          read
        '" > /dev/null 2>&1 &
      async: 10
      poll: 0

    - name: E-Mail-Ticket an Zammad senden (über SMTP / Mail-Gateway)
      ansible.builtin.mail:
        host: "10.86.100.116"
        port: 25
        from: "monitoring@aip-lab.ch"
        to: "support@aip-lab.ch"
        subject: "[ALERT #1024] Nginx Webserver Ausfall auf 10.80.49.125"
        body: |
          Kritischer Vorfall im Labor:
          
          System: 10.80.49.125
          Dienst: Nginx Webserver
          Status: Gestoppt / Autostart deaktiviert
          
          Bitte im Rahmen des ICT-Supports analysieren und beheben.
      ignore_errors: yes
