---
- name: Szenario 1 - Webserver Ausfall mit Terminal-Alert
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Alarm-Skript im Profil hinterlegen, damit es beim Login poppt
      ansible.builtin.blockinfile:
        path: "/home/user/.bashrc"
        marker: "# {mark} ANSIBLE INCIDENT ALERT"
        block: |
          echo -e "\n\033[1;31m====================================================================\033[0m"
          echo -e "\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1024 (Webserver Ausfall)\033[0m"
          echo -e "\033[1;31m====================================================================\033[0m"
          echo -e " System:     10.80.49.125"
          echo -e " Dienst:     Nginx Webserver (Gestoppt / Autostart aus)"
          echo -e " Aufgabe:    Analysieren, beheben und Dienst wiederherstellen!"
          echo -e "\033[1;31m====================================================================\033[0m\n"
