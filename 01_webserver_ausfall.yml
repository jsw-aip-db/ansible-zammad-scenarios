---
- name: Szenario 1 - Alle 4 Zammad-Alternativwege testen
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Öffne maximiertes XFCE-Terminal im Hintergrund auf der VM
      become_user: user
      environment:
        DISPLAY: ":0.0"
        XAUTHORITY: "/home/user/.Xauthority"
      ansible.builtin.shell: |
        xfce4-terminal --maximize --command="bash -c '
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo -e \"\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1024 (Webserver Ausfall)\033[0m\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \" System:     10.80.49.125\"
          echo \" Dienst:     Nginx Webserver (Gestoppt)\"
          echo \"\"
          echo \" AUFGABE: Analysieren Sie das Problem und beheben Sie den Ausfall!\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \"\"
          echo \"Drücke Enter, wenn du dieses Fenster schliessen willst...\"
          read
        '" > /dev/null 2>&1 &
      async: 10
      poll: 0

    # --- WEG 1: IMAP / Zentraler Mailserver ---
    - name: "Weg 1: Test - E-Mail an zentralen Mailserver senden"
      ansible.builtin.mail:
        host: "mail.unternehmens-domain.ch"
        port: 587
        secure: tls
        from: "aip-labor@aip-lab.ch"
        to: "support@aip-test.ch"
        subject: "[LABOR-ALERT] Nginx Ausfall auf 10.80.49.125"
        body: "Automatisierter Labor-Vorfall: Webserver gestoppt."
      ignore_errors: yes

    # --- WEG 2: Shared Storage / Drop-Folder ---
    - name: "Weg 2: Test - Ticket-Datei in Drop-Folder schreiben"
      ansible.builtin.copy:
        content: |
          SYSTEM: 10.80.49.125
          INCIDENT: Nginx Webserver Ausfall
          STATUS: Gestoppt
        dest: "/tmp/zammad_ticket_drop.txt"
      ignore_errors: yes

    # --- WEG 3: Relay-Server Webhook ---
    - name: "Weg 3: Test - Webhook an Relay-Server senden"
      ansible.builtin.uri:
        url: "http://10.80.10.x:8080/relay-ticket"
        method: POST
        body_format: json
        body:
          ip: "10.80.49.125"
          dienst: "nginx"
          status: "stopped"
        status_code: [200, 201]
      ignore_errors: yes

    # --- WEG 4: API-Call direkt über Semaphore (localhost) ---
    - name: "Weg 4: Test - Zammad-API direkt von Semaphore aus aufrufen"
      delegate_to: localhost
      run_once: true
      ansible.builtin.uri:
        url: "http://10.86.100.116:8080/api/v1/tickets"
        method: POST
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          title: "Ausfall auf 10.80.49.125"
          group: "Users"
          customer: "support@aip-test.ch"
          article:
            subject: "Labor-Alarm"
            body: "Webserver gestoppt."
        status_code: [200, 201]
      ignore_errors: yes
