---
- name: Szenario 1 - Webserver Ausfall (VM Sabotage & Desktop Popup)
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Erstelle Zammad-Ticket via lokalem Postfix auf der VM
      ansible.builtin.shell: |
        python3 -c "
        import smtplib
        from email.message import EmailMessage

        msg = EmailMessage()
        msg['Subject'] = 'CRITICAL: Webserver Ausfall auf VM 10.80.49.125'
        msg['From'] = 'support@aip-test.ch'
        msg['To'] = 'support@aip-test.ch'
        msg.set_content('''System: 10.80.49.125
        Vorfall: Interner Webserver (Nginx) reagiert nicht
        
        Bitte analysieren Sie den Dienststatus und starten Sie den Webserver!''')

        with smtplib.SMTP('127.0.0.1', 25) as server:
            server.send_message(msg)
            print('Erfolgreich via lokalem Postfix gesendet')
        "
      register: postfix_mail_result
      run_once: true

    - name: Zeige das Ergebnis des Postfix-Mailversands
      ansible.builtin.debug:
        msg: "{{ postfix_mail_result.stdout_lines }}"

    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Öffne maximiertes XFCE-Terminal im Hintergrund auf der VM
      become_user: user
      environment:
        DISPLAY: ":0.0"
        XAUTHORITY: "/home/user/.Xauthority"
      ansible.builtin.shell: |
        xfce4-terminal --maximize --command="bash -c '
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo -e \"\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1024 (Webserver Ausfall)\033[0m\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \" System:     10.80.49.125\"
          echo \" Vorfall:    Interner Webserver (Nginx) reagiert nicht\"
          echo \"\"
          echo \" AUFGABE: Analysieren Sie den Dienststatus und starten Sie den Webserver!\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \"\"
          echo \"Drücke Enter, wenn du dieses Fenster schliessen willst...\"
          read
        '" > /dev/null 2>&1 &
      async: 10
      poll: 0
