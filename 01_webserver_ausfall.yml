---
- name: Szenario 1 - Webserver Ausfall mit Netzwerk-Diagnose und Terminal-Popup
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Prüfe die lokale UFW-Firewall auf der VM
      ansible.builtin.shell: ufw status
      register: ufw_status
      ignore_errors: yes

    - name: Gib den UFW-Status im Log aus
      ansible.builtin.debug:
        msg: "{{ ufw_status.stdout_lines }}"

    - name: Netztalk-Test zu Zammad (Port 8080 und 25) durchführen
      ansible.builtin.shell: |
        nc -zv -w 3 10.86.100.116 8080 || echo "Port 8080 blockiert oder nicht erreichbar"
        nc -zv -w 3 10.86.100.116 25 || echo "Port 25 blockiert oder nicht erreichbar"
      register: netzwerk_test
      ignore_errors: yes

    - name: Zeige das Ergebnis des Netzwerk-Tests im Log
      ansible.builtin.debug:
        msg: "{{ netzwerk_test.stdout_lines }}"

    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Öffne maximiertes XFCE-Terminal im Hintergrund auf der VM
      become_user: user
      environment:
        DISPLAY: ":0.0"
        XAUTHORITY: "/home/user/.Xauthority"
      ansible.builtin.shell: |
        xfce4-terminal --maximize --command="bash -c '
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo -e \"\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1024 (Webserver Ausfall)\033[0m\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \" System:     10.80.49.125\"
          echo \" Dienst:     Nginx Webserver (Gestoppt)\"
          echo \"\"
          echo \" AUFGABE: Analysieren Sie das Problem und beheben Sie den Ausfall!\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \"\"
          echo \"Drücke Enter, wenn du dieses Fenster schliessen willst...\"
          read
        '" > /dev/null 2>&1 &
      async: 10
      poll: 0
