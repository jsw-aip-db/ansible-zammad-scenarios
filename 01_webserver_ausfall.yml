---
- name: Szenario 1 - Webserver Ausfall mit grafischem Terminal-Popup
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Öffne ein neues XFCE-Terminalfenster (bleibt offen)
      become_user: user
      environment:
        DISPLAY: ":0.0"
        XAUTHORITY: "/home/user/.Xauthority"
      ansible.builtin.shell: |
        xfce4-terminal --hold --command="bash -c '
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo -e \"\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1024 (Webserver Ausfall)\033[0m\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \" System:     10.80.49.125\"
          echo \" Dienst:     Nginx Webserver (Gestoppt)\"
          echo \"\"
          echo \" AUFGABE: Analysieren Sie das Problem und beheben Sie den Ausfall!\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
        '"
      ignore_errors: yes
