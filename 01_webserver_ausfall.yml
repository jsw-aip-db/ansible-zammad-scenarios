---
- name: Szenario 1 - Webserver Ausfall (VM Sabotage & Desktop Popup)
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Erstelle Zammad-Ticket via E-Mail an Hostpoint
      community.general.mail:
        host: smtp.hostpoint.ch
        port: 587
        username: "deine-absender-adresse@jsw.swiss" # HIER ANPASSEN
        password: "dein-mail-passwort"               # HIER ANPASSEN
        to: "support@jsw.swiss"
        subject: "CRITICAL: Webserver Ausfall auf VM 10.80.49.125"
        body: |
          System: 10.80.49.125
          Vorfall: Interner Webserver (Nginx) reagiert nicht
          
          Bitte analysieren Sie den Dienststatus und starten Sie den Webserver!
      delegate_to: localhost
      run_once: true

    - name: Öffne maximiertes XFCE-Terminal im Hintergrund auf der VM
      become_user: user
      environment:
        DISPLAY: ":0.0"
        XAUTHORITY: "/home/user/.Xauthority"
      ansible.builtin.shell: |
        xfce4-terminal --maximize --command="bash -c '
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo -e \"\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1024 (Webserver Ausfall)\033[0m\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \" System:     10.80.49.125\"
          echo \" Vorfall:    Interner Webserver (Nginx) reagiert nicht\"
          echo \"\"
          echo \" AUFGABE: Analysieren Sie den Dienststatus und starten Sie den Webserver!\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \"\"
          echo \"Drücke Enter, wenn du dieses Fenster schliessen willst...\"
          read
        '" > /dev/null 2>&1 &
      async: 10
      poll: 0
