---
- name: Szenario 1 - Webserver Ausfall (VM Sabotage & Desktop Popup)
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Öffne maximiertes XFCE-Terminal im Hintergrund auf der VM
      become_user: user
      environment:
        DISPLAY: ":0.0"
        XAUTHORITY: "/home/user/.Xauthority"
      ansible.builtin.shell: |
        xfce4-terminal --maximize --command="bash -c '
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo -e \"\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1024 (Webserver Ausfall)\033[0m\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \" System:     10.80.49.125\"
          echo \" Dienst:     Nginx Webserver (Gestoppt)\"
          echo \"\"
          echo \" AUFGABE: Analysieren Sie das Problem und beheben Sie den Ausfall!\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \"\"
          echo \"Drücke Enter, wenn du dieses Fenster schliessen willst...\"
          read
        '" > /dev/null 2>&1 &
      async: 10
      poll: 0

- name: Szenario 1 - Ticket bei Zammad via Semaphore anlegen
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Zammad API-Call direkt vom Semaphore-Server senden
      ansible.builtin.uri:
        url: "http://10.86.100.116:8080/api/v1/tickets"
        method: POST
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          title: "Webserver Ausfall auf 10.80.49.125"
          group: "Users"
          customer: "support@aip-test.ch"
          article:
            subject: "Labor-Alarm Szenario 1"
            body: "Der Nginx Webserver auf 10.80.49.125 wurde im Rahmen des ICT-Support-Labors gestoppt."
        status_code: [200, 201]
