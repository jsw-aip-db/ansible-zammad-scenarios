---
- name: Szenario 1 - Webserver Ausfall
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Lokales Notfall-Ticket als Datei auf der VM anlegen
      ansible.builtin.copy:
        dest: "/var/log/ict_support_ticket_01.txt"
        content: |
          ========================================
          NEUES TICKET: Webserver (Nginx) ausgefallen
          ========================================
          Datum/Zeit: {{ ansible_date_time.iso8601 }}
          System: 10.80.49.125
          Schweregrad: Hoch
          Fehlerbild: Der Nginx Webservice wurde gestoppt und der Autostart deaktiviert.
          Status: Offen (Wartet auf Bearbeitung durch Praktikant)
