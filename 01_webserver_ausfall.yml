---
- name: Szenario 1 - Webserver Ausfall mit Terminal-Alarm
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Stilvolles Notfall-Banner auf dem Terminal hinterlegen
      ansible.builtin.copy:
        dest: "/etc/motd"
        content: |
          
          ====================================================================
          🔴 CRITICAL INCIDENT ALERT - TICKET #1024
          ====================================================================
          System:     10.80.49.125
          Dienst:     Nginx Webserver
          Status:     AUSGEFALLEN / STOPPED
          Schweregrad: HOCH
          
          BESCHREIBUNG:
          Das automatische Überwachungssystem hat einen Totalausfall des 
          Webservers detektiert. Der Dienst wurde gestoppt und der Autostart 
          deaktiviert.
          
          AUFGABE FÜR DEN SUPPORT:
          1. Analysieren Sie die Ursache des Ausfalls.
          2. Dokumentieren Sie die Schritte im Ticketsystem.
          3. Stellen Sie den Dienst wieder her und aktivieren Sie den Autostart.
          ====================================================================
          
    - name: Lokales Notfall-Ticket als Backup im Temp-Ordner ablegen
      ansible.builtin.copy:
        dest: "/tmp/ict_support_ticket_01.txt"
        content: |
          Ticket-ID: #1024
          Fehler: Webserver Ausfall
          Timestamp: {{ ansible_date_time.iso8601 }}
