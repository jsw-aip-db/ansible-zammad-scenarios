---
- name: Szenario 1 - Webserver Ausfall mit Live-Broadcast
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Stoppt den Nginx Webserver und deaktiviert den Autostart
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: no

    - name: Live-Warnung sofort an alle offenen Terminals senden
      ansible.builtin.shell: |
        wall << "EOF"
        ====================================================================
        🔴 CRITICAL INCIDENT ALERT - TICKET #1024
        ====================================================================
        System:     10.80.49.125
        Dienst:     Nginx Webserver (AUSGEFALLEN)
        Schweregrad: HOCH
        
        Das Überwachungssystem hat soeben einen Totalausfall detektiert.
        Der Dienst wurde gestoppt und der Autostart deaktiviert.
        
        AUFGABE: 
        Analysieren Sie das Problem und stellen Sie den Dienst wieder her!
        ====================================================================
        EOF
