---
- name: Szenario 5 - SSH Ausfall (VM Sabotage & Desktop Popup)
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Öffne maximiertes XFCE-Terminal im Hintergrund auf der VM
      become_user: user
      environment:
        DISPLAY: ":0.0"
        XAUTHORITY: "/home/user/.Xauthority"
      ansible.builtin.shell: |
        xfce4-terminal --maximize --command="bash -c '
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo -e \"\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1028 (SSH Ausfall)\033[0m\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \" System:     10.80.49.125\"
          echo \" Vorfall:    SSH-Dienst gestoppt (Remote-Zugriff blockiert)\"
          echo \"\"
          echo \" AUFGABE: Analysieren Sie das Problem direkt an der Konsole und starten Sie SSH!\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \"\"
          echo \"Drücke Enter, wenn du dieses Fenster schliessen willst...\"
          read
        '" > /dev/null 2>&1 &
      async: 10
      poll: 0

    - name: Stoppt und maskiert SSH radikal im Hintergrund (entkoppelt von Ansible)
      ansible.builtin.shell: |
        nohup bash -c 'sleep 3 && systemctl mask ssh.socket ssh.service && systemctl stop ssh.socket ssh.service && pkill sshd' > /dev/null 2>&1 &
      async: 10
      poll: 0
