---
- name: Szenario 5 - SSH Ausfall (VM Sabotage & Desktop Popup)
  hosts: ziel_vm
  become: yes
  
  tasks:
    - name: Öffne maximiertes XFCE-Terminal im Hintergrund auf der VM
      become_user: user
      environment:
        DISPLAY: ":0.0"
        XAUTHORITY: "/home/user/.Xauthority"
      ansible.builtin.shell: |
        xfce4-terminal --maximize --command="bash -c '
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo -e \"\033[1;31m🔴 CRITICAL INCIDENT ALERT - TICKET #1028 (SSH Ausfall)\033[0m\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \" System:     10.80.49.125\"
          echo \" Vorfall:    SSH-Dienst gestoppt (Remote-Zugriff blockiert)\"
          echo \"\"
          echo \" AUFGABE: Analysieren Sie das Problem direkt an der Konsole und starten Sie SSH!\"
          echo -e \"\033[1;31m====================================================================\033[0m\"
          echo \"\"
          echo \"Drücke Enter, wenn du dieses Fenster schliessen willst...\"
          read
        '" > /dev/null 2>&1 &
      async: 10
      poll: 0

    - name: Stoppt den SSH Dienst und deaktiviert den Autostart
      ansible.builtin.service:
        name: ssh
        state: stopped
        enabled: no

- name: Szenario 5 - Ticket bei Zammad via Semaphore anlegen
  hosts: localhost
  connection: local
  gather_facts: no
  become: no

  tasks:
    - name: Zammad API-Call direkt vom Semaphore-Server senden
      ansible.builtin.uri:
        url: "http://10.86.100.116:8080/api/v1/tickets"
        method: POST
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          title: "SSH-Dienst offline auf 10.80.49.125"
          group: "Users"
          customer: "support@aip-test.ch"
          article:
            subject: "Labor-Alarm Szenario 5"
            body: "Der SSH-Zugriff auf 10.80.49.125 ist nicht mehr möglich. Der Dienst wurde gestoppt."
        status_code: [200, 201]
